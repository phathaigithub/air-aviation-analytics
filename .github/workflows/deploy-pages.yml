name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /air-aviation-analytics
      - uses: actions/configure-pages@v6
      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
